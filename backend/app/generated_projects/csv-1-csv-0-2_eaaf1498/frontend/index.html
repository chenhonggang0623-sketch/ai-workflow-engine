<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV 销售数据统计工具</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v16a2 2 0 0 0 2 2h16" />
          <path d="M7 13l3-3 4 4 5-6" />
        </svg>
      </div>
      <div class="brand-text">
        <h1>CSV 销售数据统计工具</h1>
        <p>Sales Analytics Dashboard</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="serverStatus" class="status-pill">--</span>
      <a class="btn btn-ghost" id="docLink" href="#" target="_blank" rel="noopener">文档</a>
    </div>
  </header>

  <main class="layout">
    <!-- 左侧控制面板 -->
    <aside class="panel sidebar">
      <section class="card upload-card">
        <h2 class="card-title">① 上传数据</h2>
        <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="上传 CSV 文件">
          <div class="drop-icon">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
          </div>
          <p class="drop-title">拖拽 CSV 文件到此处，或点击选择</p>
          <p class="drop-hint">必需列：date · category · product · quantity · amount</p>
          <input type="file" id="fileInput" accept=".csv,text/csv" hidden />
        </div>
        <div id="fileBadge" class="file-badge hidden">
          <span class="file-name" id="fileName"></span>
          <span class="file-meta" id="fileMeta"></span>
          <button class="file-clear" id="fileClear" aria-label="移除文件">×</button>
        </div>
        <button class="btn btn-link" id="loadSample">使用示例数据</button>
      </section>

      <section class="card config-card">
        <h2 class="card-title">② 报表配置</h2>
        <label class="field-label" for="outputDir">输出目录</label>
        <input class="text-input" id="outputDir" type="text" value="reports" spellcheck="false" />
        <label class="field-label" for="reportDate">报表日期（留空=取数据最新日期）</label>
        <input class="text-input" id="reportDate" type="date" />
        <button class="btn btn-primary btn-block" id="runBtn">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
          运行分析
        </button>
      </section>

      <section class="card steps-card">
        <h2 class="card-title">流水线状态</h2>
        <ol class="steps" id="steps">
          <li data-step="parse"><span class="step-dot"></span>数据解析</li>
          <li data-step="aggregate"><span class="step-dot"></span>统计聚合</li>
          <li data-step="report"><span class="step-dot"></span>报表生成</li>
          <li data-step="validate"><span class="step-dot"></span>验收</li>
        </ol>
        <p class="step-error hidden" id="stepError"></p>
      </section>
    </aside>

    <!-- 右侧结果区 -->
    <section class="panel results">
      <div class="results-empty" id="emptyState">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18" />
          <rect x="7" y="12" width="3" height="6" rx="1" />
          <rect x="12" y="8" width="3" height="10" rx="1" />
          <rect x="17" y="5" width="3" height="13" rx="1" />
        </svg>
        <h3>上传销售数据并点击「运行分析」</h3>
        <p>统计结果将在此展示：汇总表、TOP5 畅销产品、数据质量与验收结果。</p>
      </div>

      <div id="resultsWrap" class="results-wrap hidden">
        <div class="results-head">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="overview" role="tab">概览</button>
            <button class="tab" data-tab="preview" role="tab">数据预览</button>
            <button class="tab" data-tab="report" role="tab">报表预览</button>
            <button class="tab" data-tab="validate" role="tab">验收结果</button>
          </div>
          <div class="results-actions">
            <button class="btn btn-ghost btn-sm" id="downloadBtn">下载报表</button>
            <button class="btn btn-ghost btn-sm" id="downloadCsvBtn">下载处理数据</button>
          </div>
        </div>

        <!-- 概览 -->
        <div class="tab-panel active" data-panel="overview">
          <div class="kpi-grid" id="kpiGrid"></div>

          <div class="chart-row">
            <section class="card chart-card">
              <h3 class="card-title">各分类销售额（今日）</h3>
              <div class="bar-chart" id="barChart"></div>
            </section>
            <section class="card chart-card">
              <h3 class="card-title">销售额占比</h3>
              <div class="donut-wrap">
                <svg class="donut" id="donutChart" viewBox="0 0 120 120"></svg>
                <div class="donut-center" id="donutCenter"></div>
              </div>
              <ul class="legend" id="donutLegend"></ul>
            </section>
          </div>

          <section class="card chart-card">
            <h3 class="card-title">TOP5 畅销产品</h3>
            <ol class="rank-list" id="rankList"></ol>
          </section>
        </div>

        <!-- 数据预览 -->
        <div class="tab-panel" data-panel="preview">
          <div class="preview-meta" id="previewMeta"></div>
          <div class="table-scroll">
            <table class="data-table" id="dataTable"></table>
          </div>
        </div>

        <!-- 报表预览 -->
        <div class="tab-panel" data-panel="report">
          <div class="report-meta" id="reportMeta"></div>
          <article class="md-body" id="mdBody"></article>
        </div>

        <!-- 验收结果 -->
        <div class="tab-panel" data-panel="validate">
          <div class="validate-summary" id="validateSummary"></div>
          <ul class="check-list" id="checkList"></ul>
        </div>
      </div>
    </section>
  </main>

  <div class="toast hidden" id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
